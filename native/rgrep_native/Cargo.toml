[package]
name = "rgrep_native"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "tree-sitter code splitting and HF tokenization for rgrep"
license = "Apache-2.0"

[lib]
name = "rgrep_native"
crate-type = ["staticlib", "rlib"]

[dependencies]
tree-sitter = "0.25.10"
tree-sitter-go = "0.23.4"
tree-sitter-python = "0.23.6"
tree-sitter-rust = "0.23.3"
tree-sitter-javascript = "0.23.1"
tree-sitter-typescript = "0.23.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.21"
# fancy-regex instead of onig: no C dependency, and it is what the tokenizer
# only needs for AddedVocabulary patterns.
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
